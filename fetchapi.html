<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Fetch API CRUD</title>
    <link rel="stylesheet" href="stilus.css">
    <style>
        .api-container { background: white; padding: 20px; color: black; border-radius: 10px; margin: 20px; }
        .api-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .api-table th, .api-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .api-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .api-form input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-save { background: #FF6600; color: white; border: none; padding: 10px; cursor: pointer; grid-column: span 2; }
    </style>
</head>
<body>

    <nav style="background-color: #FF6600; padding: 10px;">
        <ul style="display: flex; list-style: none; margin: 0; padding: 0;">
            <li style="margin-right: 20px;"><a href="index.html" style="color: white; text-decoration: none;">Főoldal</a></li>
            <li style="margin-right: 20px;"><a href="javascript.html" style="color: white; text-decoration: none;">JS CRUD</a></li>
            <li style="margin-right: 20px;"><a href="react.html" style="color: white; text-decoration: none;">React CRUD</a></li>
            <li style="margin-right: 20px;"><a href="spa.html" style="color: white; text-decoration: none;">SPA Játékok</a></li>
            <li style="margin-right: 20px;"><a href="fetchapi.html" style="color: white; text-decoration: none; font-weight: bold;">Fetch API</a></li>
            <li style="margin-right: 20px;"><a href="axios.html" style="color: white; text-decoration: none;">Axios CRUD</a></li>
            <li style="margin-right: 20px;"><a href="oojs.html" style="color: white; text-decoration: none;">OOJS</a></li>
        </ul>
    </nav>

    <header>
        <h1 style="color: white; margin: 0;">Fetch API Menü</h1>
    </header>

    <div class="api-container">
        <h2>Rádióadók (Fetch API + PHP)</h2>
        
        <form id="radioForm" class="api-form">
            <input type="text" id="freq" placeholder="Frekvencia (MHz)" required>
            <input type="text" id="power" placeholder="Teljesítmény (kW)">
            <input type="text" id="channel" placeholder="Csatorna neve" required>
            <input type="text" id="location" placeholder="Adóhely" required>
            <button type="submit" class="btn-save">Mentés az adatbázisba</button>
        </form>

        <table class="api-table" id="apiTable">
            <thead>
                <tr>
                    <th>Frekvencia</th>
                    <th>Teljesítmény</th>
                    <th>Csatorna</th>
                    <th>Helyszín</th>
                    <th>Műveletek</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const API_URL = "api.php";
        const radioForm = document.getElementById('radioForm');
        const apiTable = document.getElementById('apiTable').getElementsByTagName('tbody')[0];

        async function fetchRadios() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderTable(data);
            } catch (error) {
                console.error(error);
            }
        }

        function renderTable(data) {
            apiTable.innerHTML = "";
            data.forEach(item => {
                const row = apiTable.insertRow();
                row.innerHTML = `
                    <td>${item.freq}</td>
                    <td>${item.power}</td>
                    <td>${item.channel}</td>
                    <td>${item.location}</td>
                    <td>
                        <button onclick="deleteRadio(${item.id})">Töröl</button>
                    </td>
                `;
            });
        }

        radioForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const radioData = {
                freq: document.getElementById('freq').value,
                power: document.getElementById('power').value,
                channel: document.getElementById('channel').value,
                location: document.getElementById('location').value
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(radioData)
            });

            radioForm.reset();
            fetchRadios();
        });

        async function deleteRadio(id) {
            if (confirm("Biztosan törlöd?")) {
                await fetch(`${API_URL}?id=${id}`, { method: 'DELETE' });
                fetchRadios();
            }
        }

        fetchRadios();
    </script>
</body>
</html>
