<body>
    <header><h1>OOJS Objektumorientált Grafika</h1></header>


    <br>

    <nav>
        <ul style="display: flex; list-style: none; background: #FF6600; padding: 10px;">
            <li><a href="index.html" style="color: white; text-decoration: none; margin-right: 15px;">Főoldal</a></li>
            <li><button onclick="createRadioShape()" style="cursor:pointer">Új Rádió Grafika</button></li>
        </ul>
    </nav>

    <div class="canvas-area" id="canvas"></div>

    <script>
        class AlapGrafika {
            constructor(nev) {
                this.nev = nev;
            }
            megjelenit() {
                const el = document.createElement('div');
                el.className = 'shape';
                return el;
            }
        }

        class RadioShape extends AlapGrafika {
            constructor(frekvencia, szin) {
                super("RádióAdó");
                this.freq = frekvencia;
                this.szin = szin;
            }

            render() {
                const div = super.megjelenit();
                const meret = Math.random() * 100 + 50;
                div.style.width = meret + 'px';
                div.style.height = meret + 'px';
                div.style.backgroundColor = this.szin;
                div.style.borderRadius = "10px";
                div.style.left = Math.random() * (window.innerWidth - 150) + 'px';
                div.style.top = Math.random() * 400 + 'px';
                div.innerHTML = this.freq + " MHz";
                
                document.getElementById('canvas').appendChild(div);
                this.animacio(div);
            }

            animacio(obj) {
                let pos = 0;
                setInterval(() => {
                    pos += 1;
                    obj.style.transform = `rotate(${pos}deg)`;
                }, 20);
            }
        }

        function createRadioShape() {
            const frekvenciak = ["87.6", "94.8", "103.3", "100.8"];
            const szinek = ["red", "blue", "green", "purple", "orange"];
            const f = frekvenciak[Math.floor(Math.random() * frekvenciak.length)];
            const sz = szinek[Math.floor(Math.random() * szinek.length)];
            
            const r = new RadioShape(f, sz);
            r.render();
        }
    </script>
</body>
