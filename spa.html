<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>SPA Játékok</title>
    <link rel="stylesheet" href="stilus.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .spa-wrapper { padding: 20px; background: white; color: black; border-radius: 10px; margin: 20px; }
        .game-nav { margin-bottom: 20px; border-bottom: 2px solid #FF6600; padding-bottom: 10px; }
        .game-nav button { padding: 10px; cursor: pointer; background: #333; color: white; border: none; border-radius: 5px; margin-right: 5px; }
    </style>
</head>

    <nav style="background-color: #FF6600; padding: 10px;">
        <ul style="display: flex; list-style: none; margin: 0; padding: 0;">
            <li style="margin-right: 20px;"><a href="index.html" style="color: white; text-decoration: none;">Főoldal</a></li>
            <li style="margin-right: 20px;"><a href="javascript.html" style="color: white; text-decoration: none;">JS CRUD</a></li>
            <li style="margin-right: 20px;"><a href="react.html" style="color: white; text-decoration: none;">React CRUD</a></li>
            <li style="margin-right: 20px;"><a href="spa.html" style="color: white; text-decoration: none;font-weight: bold;">SPA Játékok</a></li>
            <li style="margin-right: 20px;"><a href="fetchapi.html" style="color: white; text-decoration: none; ">Fetch API</a></li>
            <li style="margin-right: 20px;"><a href="axios.html" style="color: white; text-decoration: none;">Axios CRUD</a></li>
            <li style="margin-right: 20px;"><a href="oojs.html" style="color: white; text-decoration: none;">OOJS</a></li>
        </ul>
    </nav>

<body>
    <header style="background-color: red; padding: 10px;">
        <h1 style="color: white; margin: 0;">SPA Menü - React Játékok</h1>
    </header>



    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Calc = () => {
            const [out, setOut] = useState("");
            return (
                <div>
                    <h3>Számológép</h3>
                    <input type="text" value={out} readOnly style={{width: '100%', marginBottom: '10px'}} />
                    <div style={{display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '5px'}}>
                        {["7","8","9","/", "4","5","6","*", "1","2","3","-", "0",".","=","+"].map(btn => (
                            <button key={btn} onClick={() => btn === "=" ? setOut(eval(out).toString()) : setOut(out + btn)}>{btn}</button>
                        ))}
                        <button onClick={() => setOut("")} style={{gridColumn: 'span 4'}}>C</button>
                    </div>
                </div>
            );
        };

        const TicTacToe = () => {
            const [cells, setCells] = useState(Array(9).fill(null));
            const [xNext, setXNext] = useState(true);
            return (
                <div>
                    <h3>Tic-Tac-Toe</h3>
                    <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 60px)', gap: '5px'}}>
                        {cells.map((v, i) => (
                            <button key={i} style={{width: '60px', height: '60px', fontSize: '20px'}} onClick={() => {
                                if(cells[i]) return;
                                const next = cells.slice();
                                next[i] = xNext ? "X" : "O";
                                setCells(next);
                                setXNext(!xNext);
                            }}>{v}</button>
                        ))}
                    </div>
                    <button onClick={() => setCells(Array(9).fill(null))} style={{marginTop: '10px'}}>Új játék</button>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState("calc");
            return (
                <div className="spa-wrapper">
                    <div className="game-nav">
                        <button onClick={() => setView("calc")}>Számológép</button>
                        <button onClick={() => setView("ttt")}>Tic-Tac-Toe</button>
                    </div>
                    {view === "calc" ? <Calc /> : <TicTacToe />}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
